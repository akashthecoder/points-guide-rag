[project]
name = "points-guide-rag"
version = "0.1.0"
description = "Evidence-backed U.S. points and award-travel research assistant."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118.3,<1",
    "google-adk>=2.10,<3",
    "pydantic>=2.12,<3",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
